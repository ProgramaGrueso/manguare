name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Typecheck, pruebas y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

    e2e:
    name: Recorrido offline → enviada → recibida
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Instalar Chrome para Puppeteer
        run: |
          npx @puppeteer/browsers install chrome@stable --path "$RUNNER_TEMP/puppeteer"
          CHROME_PATH=$(find "$RUNNER_TEMP/puppeteer" -type f -name chrome -executable -print -quit)
          if [ -z "$CHROME_PATH" ]; then
            echo "No se encontró el ejecutable de Chrome"
            exit 1
          fi
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          echo "Chrome instalado en: $CHROME_PATH"
          "$CHROME_PATH" --version
      - run: npm run build
      - run: npm run test:e2e

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t manguare:ci .
